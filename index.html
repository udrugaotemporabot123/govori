<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Govori — O Tempora</title>
<style>
/* Mali prozor koji Vesnina ploča otvara na „Govori”. Mikrofon radi ovdje jer je ovo zasebna stranica, a ne okvir unutar claude.ai. Tekst vraća ploči preko window.opener.postMessage. */
:root{--bg:#F4F7F7;--surface:#fff;--ink:#13262B;--muted:#4A5F65;--line:#CFDBDC;--petrol:#1F4E5A;--send:#2E7D32;--warn:#9A4A12;--warn-soft:#FBEDE2;--soft:#E3EEF0}
@media (prefers-color-scheme:dark){:root{--bg:#0E1A1D;--surface:#16272C;--ink:#EEF4F3;--muted:#A8BDC0;--line:#2C444A;--petrol:#86C6D2;--send:#5DB462;--warn:#F2A877;--warn-soft:#3A2618;--soft:#1D363C}}
*{box-sizing:border-box}
html{font-size:21px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
h1{font-size:1.25rem;margin:0}
.za{color:var(--muted);font-size:.9rem;margin:0}
#mic{width:9rem;height:9rem;border-radius:50%;border:none;align-self:center;background:var(--petrol);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:inherit;font-weight:700;cursor:pointer}
#mic svg{width:3.4rem;height:3.4rem}
#mic.live{background:#B34A1E;color:#fff;animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{box-shadow:0 0 0 14px rgba(179,74,30,.18)}}
@media (prefers-reduced-motion:reduce){#mic.live{animation:none}}
#hint{text-align:center;font-weight:700;margin:0;min-height:1.5em}
textarea{width:100%;min-height:7rem;border:2px solid var(--petrol);border-radius:12px;padding:.7rem;font:inherit;background:var(--surface);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 auto;border-radius:14px;padding:.8rem 1rem;font:inherit;font-weight:700;border:2px solid transparent;cursor:pointer}
.go{background:var(--send);color:#fff}
.plain{background:var(--surface);color:var(--petrol);border-color:var(--petrol)}
.btn[disabled]{opacity:.5;cursor:default}
.note{border-radius:12px;padding:.7rem .9rem;font-size:.9rem;background:var(--soft)}
.note.err{background:var(--warn-soft)}
[hidden]{display:none!important}
.meter{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
#lvl{height:100%;width:0;background:var(--send);transition:width .08s}
.diag{color:var(--muted);font-size:.75rem;margin:0;text-align:center;min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
  <h1>Govorite, ja pišem</h1>
  <p class="za">Ovaj prozor može stajati sa strane ploče.</p>
  <p class="za" id="za"></p>
  <button id="mic" type="button" aria-label="Počni govoriti">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    <span id="miclabel">Govori</span>
  </button>
  <p id="hint">Stisnite krug i govorite.</p>
  <div class="meter" aria-hidden="true"><div id="lvl"></div></div>
  <p class="diag" id="diag"></p>
  <textarea id="text" aria-label="Izgovoreni tekst" placeholder="Ovdje se pojavljuje ono što kažete. Možete i ispraviti rukom."></textarea>
  <div class="row">
    <button class="btn go" id="send" type="button" disabled>Gotovo, upiši na ploču</button>
  </div>
  <div class="row">
    <button class="btn plain" id="clear" type="button">Obriši i kreni ispočetka</button>
  </div>
  <div id="note"></div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const polje = q.get("polje") || "";
  if (q.get("za")) $("za").textContent = "Za: " + q.get("za");
  const ta = $("text"), mic = $("mic"), label = $("miclabel"), hint = $("hint"), send = $("send");
  const say = (text, err) => { $("note").replaceChildren(); if (text){ const d = document.createElement("div"); d.className = "note" + (err ? " err" : ""); d.textContent = text; $("note").append(d); } };
  const sync = () => { send.disabled = !ta.value.trim(); };
  ta.addEventListener("input", sync);

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, live = false, base = "";
  function stopUi(msg){ live = false; mic.classList.remove("live"); label.textContent = "Govori"; mic.setAttribute("aria-label","Počni govoriti"); hint.textContent = msg; sync(); }
  // Dijagnostika: traka pokazuje čuje li preglednik mikrofon, sitni red ispod što prepoznavanje radi.
  const diag = (t) => { $("diag").textContent = t; };
  let meterOn = false;
  async function meter(){
    if (meterOn || !navigator.mediaDevices) return; meterOn = true;
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const an = ac.createAnalyser(); an.fftSize = 512; ac.createMediaStreamSource(stream).connect(an);
      const buf = new Uint8Array(an.fftSize);
      const tick = () => { an.getByteTimeDomainData(buf); let m = 0; for (const v of buf) m = Math.max(m, Math.abs(v - 128)); $("lvl").style.width = Math.min(100, m * 1.6) + "%"; requestAnimationFrame(tick); };
      tick();
    }catch(e){ meterOn = false; diag("Mikrofon: " + (e.name || e.message)); }
  }
  function start(){
    meter();
    if (!SR){ say("Ovaj preglednik ne zna pretvarati govor u tekst. Otvorite ploču u Google Chromeu ili Microsoft Edgeu.", true); return; }
    base = ta.value.trim() ? ta.value.replace(/\s*$/, " ") : "";
    rec = new SR(); rec.lang = "hr-HR"; rec.continuous = true; rec.interimResults = true;
    rec.onstart = () => diag("prepoznavanje: pokrenuto");
    rec.onaudiostart = () => diag("prepoznavanje: čujem mikrofon");
    rec.onspeechstart = () => diag("prepoznavanje: čujem govor");
    rec.onnomatch = () => diag("prepoznavanje: nisam razumio");
    rec.onresult = (e) => { let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; ta.value = base + t; sync(); };
    rec.onerror = (e) => {
      diag("prepoznavanje: greška " + e.error);
      if (e.error === "not-allowed" || e.error === "service-not-allowed") { stopUi(""); say("Preglednik nije dopustio mikrofon. Gore lijevo u adresnoj traci kliknite ikonu (lokot ili mikrofon), uključite Mikrofon i stisnite krug ponovno.", true); }
      else if (e.error === "audio-capture") { stopUi(""); say("Ne čujem mikrofon. Provjerite je li mikrofon uključen i spojen.", true); }
      else if (e.error === "network") { stopUi(""); say("Nema veze s internetom za prepoznavanje govora. Pokušajte ponovno za koji trenutak.", true); }
    };
    // Chrome sam stane nakon tišine; dok je krug crven, nastavljamo slušati.
    rec.onend = () => { if (live){ base = ta.value.trim() ? ta.value.replace(/\s*$/, " ") : ""; try{ rec.start(); return; }catch(err){} } stopUi(ta.value.trim() ? "Pročitajte tekst. Ako je dobro, stisnite zeleni gumb." : "Stisnite krug i govorite."); };
    try{ rec.start(); }catch(err){ say("Mikrofon se nije upalio. Stisnite krug ponovno.", true); return; }
    live = true; say(""); mic.classList.add("live"); label.textContent = "Stop"; mic.setAttribute("aria-label","Zaustavi"); hint.textContent = "Slušam… govorite. Stisnite krug kad završite.";
  }
  function stop(){ live = false; if (rec) try{ rec.stop(); }catch(e){} }
  mic.addEventListener("click", () => live ? stop() : start());
  $("clear").addEventListener("click", () => { ta.value = ""; base = ""; sync(); ta.focus(); });

  send.addEventListener("click", async () => {
    stop();
    const text = ta.value.trim(); if (!text) return;
    if (window.opener && !window.opener.closed){
      try{
        window.opener.postMessage({type: "otempora-glas", polje, text}, "*");
        ta.value = ""; base = ""; sync();
        hint.textContent = "✓ Upisano na ploču.";
        say("Upisano na ploču. Prozor može ostati otvoren: kad idući put stisnete Govori na ploči, nastavljate ovdje.");
        return;
      }catch(e){}
    }
    // Nema veze s pločom: tekst ide u međuspremnik pa ga Vesna zalijepi.
    try{ await navigator.clipboard.writeText(text); say("Tekst je kopiran. Vratite se na ploču, kliknite u polje i pritisnite Ctrl + V (na Macu Cmd + V)."); }
    catch(e){ ta.select(); say("Označio sam tekst. Pritisnite Ctrl + C, vratite se na ploču, kliknite u polje i pritisnite Ctrl + V.", true); }
  });

  // Rad u pozadini: ploča šalje "start"/"stop" dok Vesna drži tipku, a ovaj prozor vraća tekst dok ona govori.
  const board = window.opener;
  const tell = (m) => { try{ board && !board.closed && board.postMessage(m, "*"); }catch(e){} };
  let remote = null, remoteOn = false, remotePolje = "", remoteBase = "";
  function remoteStart(p){
    if (!SR){ tell({type:"otempora-err", polje:p, error:"no-sr"}); return; }
    remotePolje = p; remoteOn = true; remoteBase = "";
    if (remote) try{ remote.abort(); }catch(e){}
    const r = new SR(); remote = r; r.lang = "hr-HR"; r.continuous = true; r.interimResults = true;
    r.onstart = () => { diag("pozadina: slušam za ploču"); tell({type:"otempora-listening", polje:remotePolje}); };
    r.onresult = (e) => { let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; tell({type:"otempora-live", polje:remotePolje, text: remoteBase + t}); remote.last = remoteBase + t; };
    r.onerror = (e) => { diag("pozadina: greška " + e.error); if (e.error !== "no-speech" && e.error !== "aborted") tell({type:"otempora-err", polje:remotePolje, error:e.error}); };
    r.onend = () => {
      if (remoteOn && remote === r){ remoteBase = (r.last || remoteBase) ? (r.last || remoteBase).replace(/\s*$/," ") : ""; try{ r.start(); return; }catch(err){} }
      if (remote === r){ tell({type:"otempora-done", polje:remotePolje, text:(r.last || remoteBase).trim()}); diag("pozadina: gotovo"); }
    };
    try{ r.start(); }catch(e){ tell({type:"otempora-err", polje:p, error:"start"}); }
  }
  window.addEventListener("message", (e) => {
    if (!board || e.source !== board) return;
    const d = e.data || {};
    if (d.type !== "otempora-cmd") return;
    if (d.cmd === "ping") tell({type:"otempora-ready"});
    else if (d.cmd === "start") remoteStart(String(d.polje||""));
    else if (d.cmd === "stop"){ remoteOn = false; if (remote) try{ remote.stop(); }catch(err){} }
  });
  if (board){
    $("za").textContent = "Ovaj prozor radi u pozadini. Vratite se na ploču: držite tipku Option (⌥) ili Alt, ili držite gumb Govori, i pričajte.";
    tell({type:"otempora-ready"});
    setInterval(() => tell({type:"otempora-ready"}), 3000);  // ploča nakon osvježavanja ponovno pronađe ovaj prozor
  }

  if (!SR) say("Ovaj preglednik ne zna pretvarati govor u tekst. Otvorite ploču u Google Chromeu ili Microsoft Edgeu.", true);
  else hint.textContent = "Stisnite veliki krug i govorite.";
})();
</script>
</body>
</html>
