name: Yahoo most
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: yahoo-most
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  most:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      YAHOO_USER: vesnakrauth@yahoo.com
      YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: stanje
          key: yahoo-stanje-${{ github.run_id }}
          restore-keys: yahoo-stanje-
      - name: Prebaci nove Yahoo mailove u Gmail
        if: ${{ env.YAHOO_APP_PASSWORD != '' }}
        run: python3 most/yahoo_most.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: stanje
          key: yahoo-stanje-${{ github.run_id }}
